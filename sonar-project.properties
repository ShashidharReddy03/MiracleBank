sonar.projectKey=React-Prod_v6
sonar.projectName=React-Prod_v6
sonar.projectVersion=1.0

# =====================
# Source code
# =====================
sonar.sources=src,App.tsx,index.js

# =====================
# Tests (NO wildcards here)
# =====================
sonar.tests=__tests__

# =====================
# Test file filtering (this is where wildcards go)
# =====================
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**

# =====================
# Exclusions
# =====================
sonar.exclusions=**/node_modules/**,**/android/**,**/ios/**,**/dist/**,**/build/**,**/*.png,**/*.jpg,**/*.gif,**/*.svg

# =====================
# Coverage
# =====================
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# =====================
# TypeScript
# =====================
sonar.typescript.tsconfigPath=tsconfig.json

# =====================
# Encoding
# =====================
sonar.sourceEncoding=UTF-8

# =====================
# SCM
# =====================
sonar.scm.provider=git

